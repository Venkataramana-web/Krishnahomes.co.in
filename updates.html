<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Latest Updates | KrishnaHomeInterior and Furniture</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>Latest Updates & News</h1>
  <div class="header-icons">
    <button class="icon-btn" id="wishlistBtn" title="Wishlist">
      <span class="icon">❤️</span>
      <span class="badge" id="wishlistCount">0</span>
    </button>
    <button class="icon-btn" id="cartBtn" title="Shopping Cart">
      <span class="icon">🛒</span>
      <span class="badge" id="cartCount">0</span>
    </button>
  </div>
  <nav><a href="index.html">Home</a></nav>
</header>

<!-- Wishlist Panel -->
<div class="side-panel" id="wishlistPanel">
  <div class="panel-header">
    <h3>❤️ My Wishlist</h3>
    <button class="close-panel" id="closeWishlist">✕</button>
  </div>
  <div class="panel-content" id="wishlistContent">
    <p class="empty-message">Your wishlist is empty</p>
  </div>
</div>

<!-- Cart Panel -->
<div class="side-panel" id="cartPanel">
  <div class="panel-header">
    <h3>🛒 Shopping Cart</h3>
    <button class="close-panel" id="closeCart">✕</button>
  </div>
  <div class="panel-content" id="cartContent">
    <p class="empty-message">Your cart is empty</p>
  </div>
  <div class="panel-footer" id="cartFooter" style="display: none;">
    <div class="cart-total">
      <span>Total:</span>
      <span id="cartTotal">₹0</span>
    </div>
    <button class="checkout-btn" onclick="contactWhatsApp('my cart items')">💬 Contact to Order</button>
  </div>
</div>

<!-- Panel Overlay -->
<div class="panel-overlay" id="panelOverlay"></div>

<section class="updates-list">
  <ul>
    <li>Luxury Bed in Kirti Nagar — <strong>22 Mar, 2026</strong></li>
    <li>Bed Manufacturer in Delhi — <strong>23 Feb, 2026</strong></li>
    <li>High Back Chair in Janakpuri — <strong>20 Feb, 2026</strong></li>
  </ul>
</section>

<footer>
  <p>© 2026 KrishnaHomeInterior and Furniture</p>
</footer>

<script src="js/main.js"></script>
</body>
</html>
